# This file is produced from test/config.ini.in during build.  It was copied
# from a build and the SRCDIR, BUILDDIR, and RPCAUTH entries were modified to
# make it compatible with autopkgtest.
# Modifications copyright Soren Stoutner <soren@debian.org>.
# Modifications released under the Expat (Mit) license to match upstream.

# These environment variables are set by the build process and read by
# test/*/test_runner.py and test/util/rpcauth-test.py

[environment]
CLIENT_NAME=Bitcoin Knots
CLIENT_BUGREPORT=https://github.com/bitcoinknots/bitcoin/issues
SRCDIR=.
BUILDDIR=.
EXEEXT=
RPCAUTH=./share/rpcauth/rpcauth.py

[components]
# Which components are enabled. These are commented out by `configure` if they were disabled when running config.
ENABLE_WALLET=true
USE_SQLITE=true
#USE_BDB=true
ENABLE_CLI=true
ENABLE_BITCOIN_UTIL=true
ENABLE_WALLET_TOOL=true
ENABLE_UTIL_TX=true
ENABLE_UTIL_UTIL=true
ENABLE_BITCOIND=true
#ENABLE_FUZZ_BINARY=true
ENABLE_ZMQ=true
ENABLE_EXTERNAL_SIGNER=true
#ENABLE_USDT_TRACEPOINTS=true
